<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infra.Market — Operations Intelligence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  html, body { margin: 0; padding: 0; background: #F7F7F5; }
  .opi-app { --bg:#F7F7F5; --surface:#FFFFFF; --border:#E5E2DB; --text:#181818; --text2:#6B6B63; --text3:#9C9890;
    --accent:#1D4E89; --accent-bg:#E7EEF5; --owned:#6B6B63; --owned-bg:#F1EFEA; --partner:#B8960C; --partner-bg:#FBF6DC;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; }
  .opi-app *, .opi-app *::before, .opi-app *::after { box-sizing:border-box; }
  .opi-app :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .opi-app button { font-family:inherit; }

  .opi-sidebar { width:222px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); min-height:100vh; padding:20px 14px; display:flex; flex-direction:column; justify-content:space-between; }
  .opi-brand { font-size:15.5px; font-weight:800; }
  .opi-brand-sub { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; margin-bottom:14px; }
  .opi-nav-group { margin-top:14px; }
  .opi-nav-group-label { font-size:10.5px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; padding:0 10px; margin-bottom:4px; }
  .opi-nav { display:flex; flex-direction:column; gap:2px; }
  .opi-nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:none; border:none; color:var(--text2); font-size:13.5px; font-weight:500; cursor:pointer; text-align:left; width:100%; }
  .opi-nav-item:hover { background:#F2F1EC; color:var(--text); }
  .opi-nav-item--active { background:var(--accent-bg); color:var(--accent); font-weight:600; }
  .opi-sidebar-bottom { font-size:11px; color:var(--text3); border-top:1px solid var(--border); padding-top:12px; }

  .opi-main { flex:1; min-width:0; padding:20px 32px 60px; max-width:1200px; }
  .opi-search-bar { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:24px; }
  .opi-search-input { border:none; outline:none; background:none; flex:1; font-size:13.5px; color:var(--text); font-family:'Inter',sans-serif; }
  .opi-search-input::placeholder { color:var(--text3); }
  .opi-kbd { font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text3); border:1px solid var(--border); border-radius:5px; padding:2px 6px; }
  .opi-icon-muted { color:var(--text3); display:inline-flex; }
  .opi-icon-critical { color:#C0392B; } .opi-icon-high { color:#D68A1D; } .opi-icon-watch { color:#B8960C; }

  .opi-page-head { margin-bottom:20px; }
  .opi-h1 { font-size:23px; font-weight:800; letter-spacing:-0.01em; margin:0; }
  .opi-sub { font-size:13.5px; color:var(--text2); margin-top:6px; max-width:660px; line-height:1.5; }
  .opi-back { background:none; border:none; color:var(--text2); font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; margin-bottom:14px; padding:0; }
  .opi-section-label { font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.04em; margin:28px 0 12px; }

  .opi-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:0 1px 2px rgba(24,24,24,0.03); }

  .opi-health-row { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:900px) { .opi-health-row { grid-template-columns:1fr 1fr; } }
  .opi-health-hero { display:flex; flex-direction:column; justify-content:center; }
  .opi-health-label { font-size:12.5px; color:var(--text2); font-weight:600; margin-bottom:6px; }
  .opi-health-number { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; color:var(--accent); }
  .opi-health-number span { font-size:14px; color:var(--text3); font-weight:500; }
  .opi-health-sub { display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .opi-health-sub-label { font-size:11.5px; color:var(--text2); font-weight:600; }
  .opi-health-sub-number { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; }

  .opi-kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:8px; }
  @media (max-width:1000px) { .opi-kpi-grid { grid-template-columns:repeat(2,1fr); } }
  .opi-kpi-card { display:flex; flex-direction:column; gap:8px; }
  .opi-kpi-label { font-size:11.5px; color:var(--text2); font-weight:600; }
  .opi-kpi-value { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; }
  .opi-kpi-sub-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .opi-kpi-sub { font-size:11px; color:var(--text3); }

  .opi-urgency-block { margin-bottom:6px; }
  .opi-urgency-head { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 6px; }
  .opi-urgency-head--critical { color:#C0392B; } .opi-urgency-head--high { color:#D68A1D; } .opi-urgency-head--watch { color:#B8960C; }
  .opi-urgency-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; width:100%; cursor:pointer; margin-bottom:6px; }
  .opi-urgency-row:hover { border-color:#D8D4CA; }
  .opi-urgency-text { flex:1; text-align:left; }
  .opi-urgency-title { font-size:13.5px; font-weight:600; }
  .opi-urgency-sub { font-size:12px; color:var(--text2); margin-top:2px; }
  .opi-urgency-cta { font-size:12px; font-weight:600; color:var(--accent); display:flex; align-items:center; gap:3px; flex-shrink:0; }

  .opi-chain-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px) { .opi-chain-grid { grid-template-columns:1fr; } }
  .opi-chain { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .opi-chain-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .opi-chain-step { background:var(--accent-bg); color:var(--accent); font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px; }
  .opi-chain-caption { font-size:12px; color:var(--text2); margin-top:10px; line-height:1.5; }
  .opi-footnote { font-size:11.5px; color:var(--text3); margin-top:10px; }

  .opi-problem-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:1000px) { .opi-problem-grid { grid-template-columns:repeat(2,1fr); } }
  .opi-problem-card { text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px; width:100%; }
  .opi-problem-card:hover { box-shadow:0 4px 14px rgba(24,24,24,0.08); }
  .opi-problem-pillar { font-size:10.5px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; }
  .opi-problem-title { font-size:14px; font-weight:700; }
  .opi-problem-amount { font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; }
  .opi-problem-count { font-size:12px; color:var(--text2); font-weight:600; }
  .opi-problem-cta { font-size:12px; font-weight:600; color:var(--accent); display:flex; align-items:center; gap:5px; margin-top:2px; }

  .opi-filterbar { margin-bottom:10px; }
  .opi-chip-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .opi-chip { font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text2); cursor:pointer; }
  .opi-chip--active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .opi-select { font-size:12.5px; border:1px solid var(--border); border-radius:100px; padding:7px 10px; background:var(--surface); color:var(--text); font-family:'Inter',sans-serif; }
  .opi-pill-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .opi-active-pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; background:var(--accent-bg); color:var(--accent); padding:4px 8px; border-radius:100px; font-weight:600; }
  .opi-active-pill button { background:none; border:none; color:var(--accent); cursor:pointer; display:flex; padding:0; }
  .opi-clear-all { background:none; border:none; color:var(--text3); font-size:11.5px; cursor:pointer; text-decoration:underline; }
  .opi-result-count { font-size:12.5px; color:var(--text2); margin:14px 0 10px; }

  .opi-table-card { padding:0; overflow-x:auto; }
  .opi-table { width:100%; border-collapse:collapse; min-width:680px; }
  .opi-th { text-align:left; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text3); font-weight:600; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .opi-row { border-bottom:1px solid #F0EEE8; cursor:pointer; }
  .opi-row:hover { background:#FAFAF8; }
  .opi-row--static { cursor:default; } .opi-row--static:hover { background:none; }
  .opi-td { padding:12px 16px; font-size:13px; color:var(--text); white-space:nowrap; vertical-align:top; }
  .opi-td--name { font-weight:600; } .opi-td--id { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; } .opi-td--rank { color:var(--text3); }
  .opi-td-sub { font-weight:400; font-size:11.5px; color:var(--text3); margin-top:2px; }
  .opi-mono { font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .opi-empty { padding:32px; text-align:center; color:var(--text3); font-size:13px; }
  .opi-row-detail td { padding:0 16px 16px; background:#FAFAF8; }
  .opi-why-inline { font-size:12.5px; color:var(--text2); padding-top:10px; }
  .opi-why-reasons { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .opi-why-chip { background:var(--accent-bg); color:var(--accent); font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:100px; }
  .opi-map-link { background:none; border:1px solid var(--border); color:var(--accent); font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer; }
  .opi-map-link:hover { background:var(--accent-bg); }
  .opi-approve-btn { background:none; border:1px solid var(--border); color:var(--accent); font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer; }
  .opi-approve-btn:hover { background:var(--accent-bg); }

  .opi-badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:100px; }
  .opi-badge-dot { width:6px; height:6px; border-radius:50%; }
  .opi-tag { font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; display:inline-block; }
  .opi-tag--neutral { background:#F1EFEA; color:var(--text2); }
  .opi-tag--critical { background:#FBEAE8; color:#C0392B; }
  .opi-tag--high { background:#FBF0DD; color:#D68A1D; }
  .opi-tag--watch { background:#FBF6DC; color:#B8960C; }
  .opi-tag--healthy { background:#E4F5EC; color:#1F8A5F; }
  .opi-change { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; }
  .opi-change--bad { color:#C0392B; } .opi-change--good { color:#1F8A5F; } .opi-change--neutral { color:var(--text3); }

  .opi-compare-title { font-size:12.5px; color:var(--text2); margin-bottom:12px; font-weight:600; }
  .opi-compare-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .opi-compare-label { width:130px; font-size:12.5px; flex-shrink:0; }
  .opi-compare-track { flex:1; height:8px; background:#F1EFEA; border-radius:6px; overflow:hidden; }
  .opi-compare-fill { height:100%; } .opi-compare-fill--owned { background:var(--owned); } .opi-compare-fill--partner { background:var(--partner); }
  .opi-compare-value { font-family:'IBM Plex Mono',monospace; font-size:12.5px; width:30px; text-align:right; flex-shrink:0; }

  .opi-cash-input-card { margin-bottom:16px; }
  .opi-stat-label { font-size:12px; color:var(--text2); font-weight:600; margin-bottom:6px; }
  .opi-cash-value { font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--accent); margin-bottom:10px; }
  .opi-slider { width:100%; accent-color:#1D4E89; }
  .opi-slider-scale { display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text3); margin-top:6px; }

  .opi-alert-list { display:flex; flex-direction:column; gap:10px; }
  .opi-alert-card { display:flex; align-items:flex-start; gap:14px; }
  .opi-alert-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .opi-alert-body { flex:1; min-width:0; }
  .opi-alert-title { font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .opi-alert-text { font-size:12.5px; color:var(--text2); }
  .opi-investigate { background:none; border:1px solid var(--border); color:var(--accent); font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .opi-investigate:hover { background:var(--accent-bg); border-color:var(--accent); }

  .opi-forecast-callout { display:flex; align-items:center; gap:12px; color:#C0392B; border-color:#F1C7C1; background:#FDF4F2; margin-bottom:14px; }
  .opi-forecast-callout-sub { font-size:12.5px; color:var(--text2); font-weight:500; margin-top:2px; }
  .opi-chart-card { padding:18px 14px 10px; margin-bottom:20px; height:290px; position:relative; width:100%; box-sizing:border-box; }

  .opi-driver-row { display:flex; align-items:center; gap:12px; padding:9px 0; }
  .opi-driver-label { width:170px; font-size:12.5px; flex-shrink:0; }
  .opi-driver-track { flex:1; height:8px; background:#F1EFEA; border-radius:6px; overflow:hidden; }
  .opi-driver-fill { height:100%; background:var(--accent); }
  .opi-driver-value { font-family:'IBM Plex Mono',monospace; font-size:12.5px; width:60px; text-align:right; flex-shrink:0; }

  .opi-drawer-backdrop { position:fixed; inset:0; background:rgba(24,24,24,0.32); z-index:40; }
  .opi-drawer { position:fixed; top:0; right:0; bottom:0; width:410px; max-width:92vw; background:var(--surface); border-left:1px solid var(--border); z-index:41; padding:24px 22px 40px; overflow-y:auto; box-shadow:-8px 0 30px rgba(24,24,24,0.12); animation:opi-slide 0.2s ease; }
  @keyframes opi-slide { from{transform:translateX(20px);opacity:0;} to{transform:translateX(0);opacity:1;} }
  .opi-drawer-close { position:absolute; top:20px; right:20px; background:none; border:none; color:var(--text3); cursor:pointer; }
  .opi-drawer-head { margin-bottom:16px; padding-right:30px; }
  .opi-drawer-name { font-size:19px; font-weight:700; }
  .opi-drawer-sub { font-size:12.5px; color:var(--text2); display:flex; align-items:center; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .opi-drawer-score { text-align:center; padding:18px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:18px; }
  .opi-drawer-score-number { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; }
  .opi-drawer-score-number span { font-size:14px; color:var(--text3); font-weight:500; }
  .opi-drawer-score-label { font-size:12px; color:var(--text2); margin:4px 0 10px; }
  .opi-drawer-section-label { font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.03em; margin:18px 0 8px; }
  .opi-why-box { font-size:13px; line-height:1.6; background:#FAFAF8; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .opi-mini-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .opi-mini-stat { background:#FAFAF8; border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .opi-mini-label { font-size:11px; color:var(--text3); margin-bottom:4px; }
  .opi-mini-value { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; }
  .opi-chart-wrap { background:#FAFAF8; border:1px solid var(--border); border-radius:10px; padding:8px; height:150px; position:relative; width:100%; box-sizing:border-box; }
  .opi-timeline { background:#FAFAF8; border:1px solid var(--border); border-radius:10px; padding:28px 14px 44px; }
  .opi-timeline-track { position:relative; height:4px; background:#E5E2DB; border-radius:4px; }
  .opi-timeline-fill { position:absolute; top:0; left:0; height:100%; background:var(--accent); border-radius:4px; }
  .opi-timeline-point { position:absolute; top:-4px; transform:translateX(-50%); }
  .opi-timeline-dot { width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--border); }
  .opi-timeline-point--current .opi-timeline-dot { background:#C0392B; width:14px; height:14px; }
  .opi-timeline-point--predicted .opi-timeline-dot { background:#fff; border:2px dashed #C0392B; }
  .opi-timeline-label { position:absolute; top:18px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text2); white-space:nowrap; text-align:center; }
  .opi-timeline-label span { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text3); }
  .opi-recommend-box { font-size:13px; line-height:1.5; background:var(--accent-bg); color:var(--accent); border-radius:10px; padding:12px 14px; font-weight:500; }
  .opi-action-row { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .opi-action-btn { display:flex; align-items:center; gap:8px; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; padding:10px; border-radius:8px; cursor:pointer; width:100%; }
  .opi-action-btn:hover { border-color:var(--accent); color:var(--accent); }
  .opi-action-btn--done { background:#E4F5EC; border-color:#1F8A5F; color:#1F8A5F; }
  .opi-alt-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .opi-alt-card { padding:14px; }
  .opi-alt-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .opi-alt-name { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .opi-recommended-tag { font-family:'Inter',sans-serif; font-size:10px; font-weight:700; background:#E4F5EC; color:#1F8A5F; padding:2px 7px; border-radius:100px; }
  .opi-alt-sub { font-size:11.5px; color:var(--text3); margin-top:2px; }
  .opi-alt-stats { display:flex; gap:16px; margin-bottom:12px; }
  .opi-alt-stat-label { display:block; font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:0.03em; }
  .opi-alt-stat-value { font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
  .opi-reallocate-btn { width:100%; background:var(--accent); color:#fff; border:none; padding:10px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .opi-reallocate-btn:hover { opacity:0.9; }
  .opi-reallocate-btn:disabled { background:#D8D4CA; cursor:not-allowed; opacity:0.8; }

  .opi-toast { position:fixed; bottom:24px; right:24px; background:#181818; color:#fff; padding:14px 16px; border-radius:12px; display:flex; align-items:flex-start; gap:10px; max-width:340px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:60; animation:opi-toast-in 0.2s ease; }
  @keyframes opi-toast-in { from{transform:translateY(8px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .opi-toast-title { font-size:13px; font-weight:700; }
  .opi-toast-body { font-size:12px; color:#C9C7C0; margin-top:2px; }
  .opi-toast button { background:none; border:none; color:#9C9890; cursor:pointer; margin-left:auto; }

  /* Place Order flow */
  .opi-order-layout { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
  @media (max-width:900px) { .opi-order-layout { grid-template-columns:1fr; } }
  .opi-selected-unit-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:18px; flex-wrap:wrap; }

function renderForecast() {

  document.getElementById("mainContent").innerHTML = `

  renderCashChart(data);
}
function renderCashChart(data) {
  const container = document.getElementById("forecastChartContainer");
  if (typeof Chart === "undefined") { renderCashChartSVGFallback(data, container); return; }
  try {
    container.innerHTML = `<canvas id="forecastCanvas"></canvas>`;
    const ctx = document.getElementById("forecastCanvas").getContext("2d");
    if (forecastChart) { forecastChart.destroy(); forecastChart = null; }
    forecastChart = new Chart(ctx, { type: "line", data: { labels: data.map((p) => `D${p.day}`), datasets: [
        { label: "Cash position", data: data.map((p) => p.cash), borderColor: "#C0392B", backgroundColor: "rgba(192,57,43,0.1)", fill: true, tension: 0.3, borderWidth: 2.2, pointRadius: 0 },
        { label: "Break-even", data: data.map(() => 0), borderColor: "#8A8577", borderDash: [3, 3], borderWidth: 1, pointRadius: 0, fill: false },
      ] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: "#fff", borderColor: "#E5E2DB", borderWidth: 1, titleColor: "#9C9890", bodyColor: "#181818", padding: 8, cornerRadius: 8, callbacks: { label: (item) => item.dataset.label === "Cash position" ? fmtCr(item.parsed.y) : null } } },
        scales: { x: { grid: { color: "#F1EFEA" }, ticks: { color: "#9C9890", font: { size: 9 }, maxTicksLimit: 10 }, border: { color: "#E5E2DB" } }, y: { grid: { color: "#F1EFEA" }, ticks: { color: "#9C9890", font: { size: 9 }, callback: (v) => `₹${v}Cr` }, border: { color: "#E5E2DB" } } } } });
  } catch (err) {
    console.error("Chart.js failed to render, using SVG fallback:", err);
    renderCashChartSVGFallback(data, container);
  }
}
function renderCashChartSVGFallback(data, container) {
  const w = 900, h = 260, padL = 46, padR = 14, padT = 14, padB = 26;
  const values = data.map((p) => p.cash);
  const minV = Math.min(...values, 0), maxV = Math.max(...values, 0);
  const range = maxV - minV || 1;
  const xScale = (i) => padL + (i / (data.length - 1)) * (w - padL - padR);
  const yScale = (v) => padT + (1 - (v - minV) / range) * (h - padT - padB);
  const zeroY = yScale(0);
  const linePath = data.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(i).toFixed(1)} ${yScale(p.cash).toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L ${xScale(data.length - 1).toFixed(1)} ${(h - padB).toFixed(1)} L ${xScale(0).toFixed(1)} ${(h - padB).toFixed(1)} Z`;
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const v = minV + range * (1 - f); const y = padT + f * (h - padT - padB);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#F1EFEA" stroke-width="1"/><text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9C9890" font-family="IBM Plex Mono, monospace">₹${Math.round(v)}Cr</text>`;
  }).join("");
  const xLabels = [0, Math.floor(data.length / 2), data.length - 1].map((i) => `<text x="${xScale(i).toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="9" fill="#9C9890" font-family="IBM Plex Mono, monospace">D${data[i].day}</text>`).join("");
  container.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
      ${gridLines}
      <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w - padR}" y2="${zeroY.toFixed(1)}" stroke="#8A8577" stroke-width="1" stroke-dasharray="4 3"/>
      <path d="${areaPath}" fill="rgba(192,57,43,0.1)"/>
      <path d="${linePath}" fill="none" stroke="#C0392B" stroke-width="2.2"/>
      ${xLabels}
    </svg>`;
}
function renderInventory() {
  const total = INVENTORY.reduce((s, i) => s + i.valueLocked, 0); const slow = INVENTORY.filter((i) => i.slowMoving);

function renderRiskMap() {
  const rows = STATE_NAMES.map((state) => {
    const b = BUYERS.filter((x) => x.state === state), v = VENDORS.filter((x) => x.state === state), u = UNITS.filter((x) => x.state === state);
    const cashScore = b.length ? b.reduce((s, x) => s + x.riskScore, 0) / b.length : 0;
    const vScore = v.length ? v.reduce((s, x) => s + x.priorityScore, 0) / v.length : 0;
    const cashBand = Math.max(cashScore, vScore * 0.8) >= 65 ? "critical" : Math.max(cashScore, vScore * 0.8) >= 45 ? "high" : "watch";
    const mfgAvg = u.length ? u.reduce((s, x) => s + (100 - x.reliabilityScore), 0) / u.length : 0;
    const mfgBand = mfgAvg >= 45 ? "critical" : mfgAvg >= 30 ? "high" : "watch";
    return { state, cashBand, mfgBand, activity: b.length + u.length };
  }).sort((a, b) => (SEVERITY_ORDER[a.cashBand] + SEVERITY_ORDER[a.mfgBand]) - (SEVERITY_ORDER[b.cashBand] + SEVERITY_ORDER[b.mfgBand]) || b.activity - a.activity).slice(0, 10);
  document.getElementById("mainContent").innerHTML = `
    <div class="opi-page-head"><h1 class="opi-h1">Where is risk concentrated?</h1><p class="opi-sub">Cash risk and manufacturing risk, by state — click through to investigate either side.</p></div>
    <div class="opi-card opi-table-card"><table class="opi-table"><thead><tr><th class="opi-th">State</th><th class="opi-th">Cash Risk</th><th class="opi-th">Manufacturing Risk</th><th class="opi-th"></th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="opi-row opi-row--static"><td class="opi-td opi-td--name">${r.state}</td><td class="opi-td">${severityBadgeHTML(r.cashBand)}</td><td class="opi-td">${severityBadgeHTML(r.mfgBand)}</td>
        <td class="opi-td"><div style="display:flex;gap:8px;"><button class="opi-map-link" data-action="map-nav" data-state="${r.state}" data-view="receivables">Cash →</button><button class="opi-map-link" data-action="map-nav" data-state="${r.state}" data-view="factories">Factories →</button></div></td></tr>`).join("")}</tbody>
    </table></div>`;
}

function closeDrawer() { drawerEntity = null; if (drawerChart) { drawerChart.destroy(); drawerChart = null; } document.getElementById("drawerRoot").innerHTML = ""; }
function renderDrawer() {
  if (!drawerEntity) return;

}
function renderBuyerDrawer() {
  const b = BUYERS.find((x) => x.id === drawerEntity.id); if (!b) return;
  const timeline = buildTimeline(b); const maxDay = Math.max(120, b.predictedPaymentDays + 10);
  const actionBtn = (key, icon, label) => `<button class="opi-action-btn ${drawerAction === key ? "opi-action-btn--done" : ""}" data-action="drawer-action" data-key="${key}" data-label="${label}" data-name="${b.name}">${drawerAction === key ? ICON.checkCircle : icon} ${label}</button>`;
  document.getElementById("drawerRoot").innerHTML = `
    <div class="opi-drawer-backdrop" data-action="close-drawer"></div>
    <div class="opi-drawer">
      <button class="opi-drawer-close" data-action="close-drawer">${ICON.x}</button>
      <div class="opi-drawer-head"><div class="opi-drawer-name">${b.name}</div><div class="opi-drawer-sub">${ICON.mapPin} ${b.state} · ${b.buyerType}</div></div>
      <div class="opi-drawer-score"><div class="opi-drawer-score-number">${b.riskScore}<span> / 100</span></div><div class="opi-drawer-score-label">Receivables Risk</div>${severityBadgeHTML(b.severity)}</div>
      <div class="opi-drawer-section-label">Why is this flagged?</div>
      <div class="opi-why-box">Payment behavior has deteriorated over the last three billing cycles. Current outstanding balance is ${fmtCr(b.outstanding)}, with ${b.daysOutstanding} days outstanding.</div>
      <div class="opi-mini-grid">
        <div class="opi-mini-stat"><div class="opi-mini-label">Outstanding</div><div class="opi-mini-value">${fmtCr(b.outstanding)}</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">Days outstanding</div><div class="opi-mini-value">${b.daysOutstanding}d</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">Historical average</div><div class="opi-mini-value">${b.historicalAvgDays}d</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">Predicted payment</div><div class="opi-mini-value">~${b.predictedPaymentDays}d</div></div>
      </div>
      <div class="opi-drawer-section-label">Cash timeline</div>
      <div class="opi-timeline"><div class="opi-timeline-track">
        <div class="opi-timeline-fill" style="width:${(b.daysOutstanding / maxDay) * 100}%"></div>
        ${timeline.map((t) => `<div class="opi-timeline-point ${t.isCurrent ? "opi-timeline-point--current" : ""} ${t.isPredicted ? "opi-timeline-point--predicted" : ""}" style="left:${(t.day / maxDay) * 100}%"><div class="opi-timeline-dot"></div><div class="opi-timeline-label">${t.label}<span>${t.day}d</span></div></div>`).join("")}
      </div></div>
      ${b.severity !== "healthy" ? `
        <div class="opi-drawer-section-label">Recommended action</div>
        <div class="opi-recommend-box">Escalate collection for ${b.name}. The account is ${fmtCr(b.outstanding)} outstanding, trending ${Math.max(1, b.predictedPaymentDays - b.historicalAvgDays)} days slower than usual.</div>
        <div class="opi-action-row">${actionBtn("contact", ICON.phone, "Contact buyer")}${actionBtn("escalate", ICON.flag, "Escalate internally")}${actionBtn("schedule", ICON.calendarClock, "Schedule review")}</div>
      ` : ""}
    </div>`;
}
function renderFactoryDrawer() {
  const u = UNITS.find((x) => x.id === drawerEntity.id); if (!u) return;
  const worst = worstMfgProblemFor(u);
  const contextProblem = MFG_PROBLEMS.find((p) => p.key === drawerEntity.problem) || (worst && worst.p) || MFG_PROBLEMS[0];
  const hist = u[contextProblem.histKey], cur = u[contextProblem.valueKey]; const dir = cur >= hist ? "increased" : "decreased";
  const whySentence = worst ? `${contextProblem.metricLabel} ${dir} from ${fmtVal(hist, contextProblem.unit)} → ${fmtVal(cur, contextProblem.unit)} over the last 90 days.` : "This factory has no active flags — all tracked metrics are healthy.";
  const alternatives = findAlternativeUnits(u, UNITS);
  const showAction = u.overallSeverity !== "healthy";
  document.getElementById("drawerRoot").innerHTML = `
    <div class="opi-drawer-backdrop" data-action="close-drawer"></div>
    <div class="opi-drawer">
      <button class="opi-drawer-close" data-action="close-drawer">${ICON.x}</button>
      <div class="opi-drawer-head"><div class="opi-drawer-name">${u.displayName}</div><div class="opi-drawer-sub">${ICON.mapPin} ${u.city}, ${u.state} · ${tagHTML(u.type === "Partner" ? "Third-party" : "Owned", u.isPartner ? "watch" : "neutral")}</div></div>
      <div class="opi-drawer-score"><div class="opi-drawer-score-number">${u.reliabilityScore}<span> / 100</span></div><div class="opi-drawer-score-label">Reliability</div>${severityBadgeHTML(u.overallSeverity)}</div>
      <div class="opi-drawer-section-label">Why is this flagged?</div><div class="opi-why-box">${whySentence}</div>
      <div class="opi-mini-grid">
        <div class="opi-mini-stat"><div class="opi-mini-label">Quality</div><div class="opi-mini-value">${fmtVal(u.rejectRate, "%")}</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">On-time delivery</div><div class="opi-mini-value">${fmtVal(u.onTimeRate, "%")}</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">Lead time</div><div class="opi-mini-value">${u.leadTimeDays.toFixed(1)}d</div></div>
        <div class="opi-mini-stat"><div class="opi-mini-label">Capacity</div><div class="opi-mini-value">${fmtVal(u.capacityUtil, "%")}</div></div>
      </div>
      <div class="opi-drawer-section-label">${contextProblem.metricLabel} — last 90 days</div>
      <div class="opi-chart-wrap" id="drawerChartContainer"></div>
      ${showAction ? `
        <div class="opi-drawer-section-label">Recommended action</div>
        <div class="opi-recommend-box">${u.overallSeverity === "watch" ? "Monitor closely — reallocation not required yet." : "Consider reallocating upcoming orders from this factory."}</div>
        ${alternatives.length === 0 ? `<div class="opi-empty">No better-performing factory found in this category.</div>` : `
        <div class="opi-alt-list">${alternatives.map((alt) => `
          <div class="opi-card opi-alt-card">
            <div class="opi-alt-head"><div><div class="opi-alt-name">${alt.id}${alt.recommended ? `<span class="opi-recommended-tag">Recommended</span>` : ""}</div><div class="opi-alt-sub">${alt.city}, ${alt.state} · ${alt.distanceKm} km</div></div>${tagHTML(alt.type === "Partner" ? "Third-party" : "Owned", alt.isPartner ? "watch" : "neutral")}</div>
            <div class="opi-alt-stats"><div><span class="opi-alt-stat-label">Reliability</span><span class="opi-alt-stat-value">${alt.reliabilityScore}</span></div><div><span class="opi-alt-stat-label">${contextProblem.metricLabel}</span><span class="opi-alt-stat-value">${fmtVal(alt[contextProblem.valueKey], contextProblem.unit)}</span></div><div><span class="opi-alt-stat-label">Capacity free</span><span class="opi-alt-stat-value">${alt.capacityAvailable}%</span></div></div>
            <button class="opi-reallocate-btn" data-action="reallocate" data-from="${u.id}" data-to="${alt.id}">Reallocate order</button>
          </div>`).join("")}</div>`}
      ` : ""}
      <div class="opi-drawer-section-label">Order from this factory</div>
      <button class="opi-reallocate-btn" data-action="open-place-order" data-factory="${u.id}">${ICON.package} Place Order</button>
      ${ORDERS.filter((o) => o.factoryId === u.id).length > 0 ? `
      <div class="opi-drawer-section-label" style="margin-top:16px;">Orders with this factory</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${ORDERS.filter((o) => o.factoryId === u.id).map((o) => `
          <div class="opi-card" style="padding:12px;display:flex;justify-content:space-between;align-items:center;">
            <div><div style="font-weight:600;font-size:12.5px;">${o.id}</div><div style="font-size:11.5px;color:var(--text3);">${o.product} · ${o.quantity.toLocaleString()} ${o.unitLabel}</div></div>
            ${o.status === "review" ? tagHTML("In Review", "watch") : tagHTML(`Net ${o.paymentTermsDays}d`, "healthy")}
          </div>`).join("")}
      </div>` : ""}
    </div>`;
  const series = buildUnitTrend(hist, cur, hashStr(u.id + contextProblem.key));
  renderDrawerChart(series, contextProblem);
}
function renderDrawerChart(series, contextProblem) {
  const container = document.getElementById("drawerChartContainer");
  if (typeof Chart === "undefined") { renderDrawerChartSVGFallback(series, contextProblem, container); return; }
  try {
    container.innerHTML = `<canvas id="drawerCanvas"></canvas>`;
    const ctx = document.getElementById("drawerCanvas").getContext("2d");
    if (drawerChart) { drawerChart.destroy(); drawerChart = null; }
    const datasets = [{ label: contextProblem.metricLabel, data: series.values, borderColor: "#1D4E89", backgroundColor: "rgba(29,78,137,0.08)", fill: true, tension: 0.35, borderWidth: 2, pointRadius: 0 }];
    if (contextProblem.threshold !== null) datasets.push({ label: "Risk threshold", data: new Array(series.labels.length).fill(contextProblem.threshold), borderColor: "#D68A1D", borderDash: [4, 3], borderWidth: 1, pointRadius: 0, fill: false });
    drawerChart = new Chart(ctx, { type: "line", data: { labels: series.labels.map((d) => `${d}d`), datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: "#fff", borderColor: "#E5E2DB", borderWidth: 1, padding: 8, cornerRadius: 8, callbacks: { label: (item) => `${item.dataset.label}: ${fmtVal(item.parsed.y, contextProblem.unit)}` } } }, scales: { x: { grid: { color: "#F1EFEA" }, ticks: { color: "#9C9890", font: { size: 9 } }, border: { color: "#E5E2DB" } }, y: { grid: { color: "#F1EFEA" }, ticks: { color: "#9C9890", font: { size: 9 } }, border: { color: "#E5E2DB" } } } } });
  } catch (err) {
    console.error("Chart.js failed to render drawer chart, using SVG fallback:", err);
    renderDrawerChartSVGFallback(series, contextProblem, container);
  }
}
function renderDrawerChartSVGFallback(series, contextProblem, container) {
  const w = 520, h = 134, padL = 34, padR = 10, padT = 10, padB = 20;
  const values = series.values;
  const threshold = contextProblem.threshold;
  const allVals = threshold !== null ? [...values, threshold] : values;
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = maxV - minV || 1;
  const xScale = (i) => padL + (i / (values.length - 1)) * (w - padL - padR);
  const yScale = (v) => padT + (1 - (v - minV) / range) * (h - padT - padB);
  const linePath = values.map((v, i) => `${i === 0 ? "M" : "L"} ${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L ${xScale(values.length - 1).toFixed(1)} ${(h - padB).toFixed(1)} L ${xScale(0).toFixed(1)} ${(h - padB).toFixed(1)} Z`;
  const thresholdLine = threshold !== null ? `<line x1="${padL}" y1="${yScale(threshold).toFixed(1)}" x2="${w - padR}" y2="${yScale(threshold).toFixed(1)}" stroke="#D68A1D" stroke-width="1" stroke-dasharray="4 3"/>` : "";
  const xLabels = [0, Math.floor((values.length - 1) / 2), values.length - 1].map((i) => `<text x="${xScale(i).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="8" fill="#9C9890" font-family="IBM Plex Mono, monospace">${series.labels[i]}d</text>`).join("");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block;">
    <path d="${areaPath}" fill="rgba(29,78,137,0.08)"/>
    <path d="${linePath}" fill="none" stroke="#1D4E89" stroke-width="2"/>
    ${thresholdLine}
    ${xLabels}
  </svg>`;
}

/* ================================================================== */
/* Router                                                               */
/* ================================================================== */
function renderMain() {
  renderSidebar();
  if (view === "overview") renderOverview();
  else if (view === "problems") renderProblems();
  else if (view === "problemDetail") renderMfgProblemDetail();
  else if (view === "receivables") renderReceivablesShell();
  else if (view === "vendors") renderVendorsShell();
  else if (view === "payments") renderPaymentsShell();
  else if (view === "forecast") renderForecast();
  else if (view === "inventory") renderInventory();
  else if (view === "factories") renderFactoriesShell();
  else if (view === "placeOrder") renderPlaceOrder();
  else if (view === "riskmap") renderRiskMap();
  else if (view === "actions") renderActions();
  else if (view === "alerts") renderAlerts();
}
function openView(v) { filters = { severity: "all", state: "all", type: "all", amount: "all" }; view = v; renderMain(); }

function handleSearch(text) {
  const q = text.toLowerCase();
  const mfgProblem = MFG_PROBLEMS.find((p) => q.includes(p.key) || q.includes(p.label.toLowerCase()));
  const matchedState = STATE_NAMES.find((s) => q.includes(s.toLowerCase()));
  const wantsPartner = q.includes("third-party") || q.includes("third party"); const wantsOwned = q.includes("owned") && !wantsPartner;
  const sev = ["critical", "high", "watch"].find((s) => q.includes(s));
  filters = { severity: sev || "all", state: matchedState || "all", type: wantsPartner ? "Partner" : wantsOwned ? "Owned" : "all", amount: "all" };
  if (mfgProblem) { problemKey = mfgProblem.key; view = "problemDetail"; renderMain(); return; }
  if (q.includes("buyer") || q.includes("receivable")) { view = "receivables"; renderMain(); return; }
  if (q.includes("vendor")) { view = "vendors"; renderMain(); return; }
  if (q.includes("factor") || q.includes("unit")) { view = "factories"; renderMain(); return; }
  view = "problems"; renderMain();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "nav") openView(el.dataset.view);
  else if (action === "open-problem") { if (el.dataset.nav === "problemDetail") { problemKey = el.dataset.problemKey; filters = { severity: "all", state: "all", type: "all", amount: "all" }; view = "problemDetail"; renderMain(); } else openView(el.dataset.nav); }
  else if (action === "open-drawer") openDrawer(el.dataset.type, el.dataset.id, el.dataset.problem);
  else if (action === "close-drawer") closeDrawer();
  else if (action === "drawer-action") { drawerAction = el.dataset.key; renderDrawer(); showToast({ title: `${el.dataset.label} — ${el.dataset.name}` }); }
  else if (action === "set-filter") { filters[el.dataset.key] = el.dataset.value; refreshFiltered(); }
  else if (action === "toggle-severity") { filters.severity = filters.severity === el.dataset.value ? "all" : el.dataset.value; refreshFiltered(); }
  else if (action === "clear-filter") { filters[el.dataset.key] = "all"; refreshFiltered(); }
  else if (action === "clear-all-filters") { filters = { severity: "all", state: "all", type: "all", amount: "all" }; refreshFiltered(); }
  else if (action === "toggle-vendor-row") { expandedVendorRow = expandedVendorRow === el.dataset.id ? null : el.dataset.id; renderVendorsBody(); }
  else if (action === "toggle-payment-row") { expandedPaymentRow = expandedPaymentRow === el.dataset.id ? null : el.dataset.id; renderPaymentsBody(); }
  else if (action === "approve-payment") {
    const id = el.dataset.id, name = el.dataset.name, max = Number(el.dataset.max);
    const input = document.getElementById(`payAmt-${id}`);
    let amount = input ? Number(input.value) : max;
    if (isNaN(amount)) amount = max;
    amount = r1(Math.max(0, Math.min(amount, max)));
    if (amount <= 0) { showToast({ title: "Enter an amount greater than ₹0 to approve." }); return; }
    PAID_AMOUNTS[id] = (PAID_AMOUNTS[id] || 0) + amount;
    const leftover = r1(max - amount);
    showToast({ title: `Payment approved — ${name}`, body: leftover > 0 ? `${fmtCr(amount)} released. ${fmtCr(leftover)} still remaining.` : `${fmtCr(amount)} released. Fully paid.` });
    renderPaymentsBody();
  }
  else if (action === "set-range") { forecastRange = Number(el.dataset.range); renderForecast(); }
  else if (action === "reallocate") { const alt = UNITS.find((x) => x.id === el.dataset.to); showToast({ title: `Order reassigned — ${el.dataset.from} → ${el.dataset.to}`, body: "Expected delivery impact: +0.5 day." }); }
  else if (action === "open-place-order") {
    placeOrderUnitId = el.dataset.factory || null; placeOrderProductIdx = null; placeOrderConfig = {}; placeOrderQty = 0; placeOrderConfirmedOrder = null; placeOrderSearch = "";
    if (drawerEntity) closeDrawer();
    view = "placeOrder"; renderMain();
  }
  else if (action === "select-unit") { placeOrderUnitId = el.dataset.id; placeOrderProductIdx = null; placeOrderConfig = {}; placeOrderQty = 0; renderPlaceOrder(); }
  else if (action === "change-unit") { placeOrderUnitId = null; placeOrderProductIdx = null; renderPlaceOrder(); }
  else if (action === "select-product") {
    placeOrderProductIdx = Number(el.dataset.idx);
    const unit = UNITS.find((u) => u.id === placeOrderUnitId);
    const fields = CATEGORY_CONFIG_FIELDS[unit.category] || [{ key: "type", label: "Type / Grade", options: ["Standard", "Premium"] }];
    placeOrderConfig = {}; fields.forEach((f) => { placeOrderConfig[f.key] = f.options[0]; });
    const cap = unitCapacityQty(unit); const inc = CATEGORY_INCREMENT[unit.category] || 10;
    placeOrderQty = Math.round((cap * 0.2) / inc) * inc;
    renderPlaceOrder();
  }
  else if (action === "qty-inc") { const unit = UNITS.find((u) => u.id === placeOrderUnitId); const inc = CATEGORY_INCREMENT[unit.category] || 10; placeOrderQty = placeOrderQty + inc; renderPlaceOrder(); }
  else if (action === "qty-dec") { const unit = UNITS.find((u) => u.id === placeOrderUnitId); const inc = CATEGORY_INCREMENT[unit.category] || 10; placeOrderQty = Math.max(0, placeOrderQty - inc); renderPlaceOrder(); }
  else if (action === "submit-order") { if (!el.disabled) submitOrder(); }
  else if (action === "view-order-factory") { const factoryId = el.dataset.factory; placeOrderConfirmedOrder = null; view = "factories"; renderMain(); openDrawer("factory", factoryId, null); }
  else if (action === "place-another-order") { placeOrderUnitId = null; placeOrderProductIdx = null; placeOrderConfirmedOrder = null; renderPlaceOrder(); }
  else if (action === "map-nav") { filters = { severity: "all", state: el.dataset.state, type: "all", amount: "all" }; view = el.dataset.view; renderMain(); }
  else if (action === "action-review") { const a = window.__opiActions[Number(el.dataset.index)]; if (a.drawer) openDrawer(a.drawer.type, a.drawer.id); else if (a.nav) openView(a.nav); }
  else if (action === "alert-investigate") { const a = window.__opiAlerts[Number(el.dataset.index)]; if (a.drawer) openDrawer(a.drawer.type, a.drawer.id, a.drawer.problem); else if (a.nav) openView(a.nav); }
  else if (action === "close-toast") { document.getElementById("toastRoot").innerHTML = ""; if (toastTimer) clearTimeout(toastTimer); }
});
function refreshFiltered() {
  if (view === "receivables") { renderReceivablesFilters(); renderReceivablesBody(); }
  else if (view === "vendors") { renderVendorsFilters(); renderVendorsBody(); }
  else if (view === "factories") { renderFactoriesFilters(); renderFactoriesBody(); }
  else if (view === "problemDetail") renderMfgProblemDetail();
}

const searchInput = document.getElementById("globalSearch");
searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.value.trim()) handleSearch(e.target.value); });
window.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); searchInput.focus(); } });

document.addEventListener("change", (e) => {
  if (e.target.matches('[data-action="set-config"]')) { placeOrderConfig[e.target.dataset.key] = e.target.value; renderPlaceOrder(); }
  else if (e.target.id === "qtyDirectInput") { placeOrderQty = Math.max(0, Number(e.target.value) || 0); renderPlaceOrder(); }
});

renderMain();
</script>
